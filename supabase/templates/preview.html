<script>
const drafts=JSON.parse(document.getElementById('data').textContent);
const picker=document.getElementById('template'),frame=document.getElementById('email');
drafts.forEach((draft,i)=>picker.add(new Option(draft.name,i)));
function show(){const draft=drafts[Number(picker.value)];document.getElementById('subject').textContent='Subject: '+draft.subject;document.getElementById('resend').href=draft.url;frame.srcdoc=draft.html;}
picker.addEventListener('change',show);
document.getElementById('mobile').addEventListener('click',()=>frame.style.width='375px');
document.getElementById('desktop').addEventListener('click',()=>frame.style.width='100%');
show();
</script></body></html>
